name: CI/CD Kubernetes FastAPI

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "k8s/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. activer Docker build optimisé
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. login DockerHub
      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 4. build + push image
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. setup kubeconfig (accès cluster)
      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=kubeconfig

      # 6. deploy Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/fastapi-deployment \
          fastapi=${{ secrets.DOCKER_USERNAME }}/fastapi:${{ github.sha }}

      # 7. check rollout
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/fastapi-deployment